version: 1.3.15

cache: true

mcpSettings:
  allowedAddresses:
    # SearXNG
    - "host.docker.internal:3001"
    - "172.17.0.1:3001"
    - "127.0.0.1:3001"
    # Crawl4AI Bridge
    - "host.docker.internal:8055"
    - "127.0.0.1:8055"
    - "172.17.0.1:8055"

endpoints:
  custom:
    - name: "llama.cpp"
      apiKey: "dummy"
      baseURL: "http://host.docker.internal:8181/v1"
      models:
        default: ["unsloth/Qwen3.8-27B-GGUF"]
        fetch: true
      titleConvo: false
      modelDisplayLabel: "Local Qwen (llama.cpp)"

mcpServers:
  searxng:
    type: streamable-http
    url: "http://host.docker.internal:3001/mcp"
  crawl4ai:
    type: sse
    url: "http://host.docker.internal:8055/sse"
    timeout: 90000
    initTimeout: 30000
